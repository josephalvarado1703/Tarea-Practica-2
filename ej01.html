<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 1: Cambio de estilo al clic</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#0b1020;color:#f4f6ff;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,100%);background:#151d33;border:1px solid #2b3657;border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 18px 55px #0005}
h1{margin-top:0;font-size:clamp(1.6rem,4vw,2.2rem)} p{color:#b8c2da;line-height:1.55}
button,input,select{font:inherit;border:0;border-radius:10px;padding:11px 14px;margin:5px 3px}
button{background:#7c5cff;color:white;cursor:pointer;font-weight:bold}button:hover{filter:brightness(1.12)} input,select{background:#0c1327;color:#fff;border:1px solid #354263;max-width:100%}
.back{display:inline-block;color:#a9ffe9;text-decoration:none;margin-bottom:20px} .muted{color:#aeb8d0} .result{margin-top:16px;color:#a9ffe9;font-weight:bold}

</style>
</head>
<body><main><a class="back" href="index.html">← Volver al menú principal</a><h1>Ejercicio 1: Cambio de estilo al clic</h1>
<p>Presiona el botón para cambiar el color de fondo de la tarjeta.</p>
<section id="tarjeta" style="padding:28px;border-radius:16px;background:#263657;text-align:center;transition:background .4s,transform .4s">
  <h2>¡Hola, programación web!</h2><p>Este elemento cambiará de apariencia.</p>
</section><p><button id="cambiar">Cambiar estilo</button></p>
<div id="mensaje" class="result" aria-live="polite"></div>
</main>
<script>

const tarjeta=document.getElementById('tarjeta');
const colores=['#263657','#5b2c83','#12665b','#8a3d35','#66551c'];
let i=0;
document.getElementById('cambiar').addEventListener('click',()=>{
 i=(i+1)%colores.length; tarjeta.style.background=colores[i];
 tarjeta.style.transform= i%2 ? 'scale(1.02)' : 'scale(1)';
 document.getElementById('mensaje').textContent='¡Estilo actualizado correctamente!';
});

</script></body></html>
