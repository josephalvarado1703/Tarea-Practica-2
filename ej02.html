<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 2: Calculadora simple</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#0b1020;color:#f4f6ff;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,100%);background:#151d33;border:1px solid #2b3657;border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 18px 55px #0005}
h1{margin-top:0;font-size:clamp(1.6rem,4vw,2.2rem)} p{color:#b8c2da;line-height:1.55}
button,input,select{font:inherit;border:0;border-radius:10px;padding:11px 14px;margin:5px 3px}
button{background:#7c5cff;color:white;cursor:pointer;font-weight:bold}button:hover{filter:brightness(1.12)} input,select{background:#0c1327;color:#fff;border:1px solid #354263;max-width:100%}
.back{display:inline-block;color:#a9ffe9;text-decoration:none;margin-bottom:20px} .muted{color:#aeb8d0} .result{margin-top:16px;color:#a9ffe9;font-weight:bold}

</style>
</head>
<body><main><a class="back" href="index.html">← Volver al menú principal</a><h1>Ejercicio 2: Calculadora simple</h1>
<p>Ingresa dos números y selecciona la operación que deseas realizar.</p>
<div><input type="number" id="n1" placeholder="Primer número" step="any">
<select id="op" aria-label="Operación"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select>
<input type="number" id="n2" placeholder="Segundo número" step="any"></div>
<p><button id="calcular">Calcular</button><button id="limpiar" style="background:#34415f">Limpiar</button></p>
<label for="resultado">Resultado:</label><input id="resultado" readonly placeholder="Aquí aparecerá el resultado" style="width:min(100%,360px)">
<div id="error" class="result" aria-live="polite"></div>
</main>
<script>

const n1=document.getElementById('n1'),n2=document.getElementById('n2'),op=document.getElementById('op');
document.getElementById('calcular').addEventListener('click',()=>{
 const a=n1.value.trim(),b=n2.value.trim(),operacion=op.value;
 const error=document.getElementById('error'),salida=document.getElementById('resultado');
 if(a===''||b===''){error.textContent='Ingresa los dos números.';salida.value='';return;}
 const x=Number(a),y=Number(b);let r;
 if(operacion==='+')r=x+y;else if(operacion==='-')r=x-y;else if(operacion==='*')r=x*y;else {if(y===0){error.textContent='No se puede dividir para cero.';salida.value='';return;}r=x/y;}
 salida.value=String(Number(r.toFixed(8)));error.textContent='Operación realizada.';
});
document.getElementById('limpiar').addEventListener('click',()=>{n1.value='';n2.value='';document.getElementById('resultado').value='';document.getElementById('error').textContent='';});

</script></body></html>
