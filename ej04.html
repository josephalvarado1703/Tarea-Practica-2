<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 4: Reloj analógico</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#0b1020;color:#f4f6ff;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,100%);background:#151d33;border:1px solid #2b3657;border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 18px 55px #0005}
h1{margin-top:0;font-size:clamp(1.6rem,4vw,2.2rem)} p{color:#b8c2da;line-height:1.55}
button,input,select{font:inherit;border:0;border-radius:10px;padding:11px 14px;margin:5px 3px}
button{background:#7c5cff;color:white;cursor:pointer;font-weight:bold}button:hover{filter:brightness(1.12)} input,select{background:#0c1327;color:#fff;border:1px solid #354263;max-width:100%}
.back{display:inline-block;color:#a9ffe9;text-decoration:none;margin-bottom:20px} .muted{color:#aeb8d0} .result{margin-top:16px;color:#a9ffe9;font-weight:bold}

</style>
</head>
<body><main><a class="back" href="index.html">← Volver al menú principal</a><h1>Ejercicio 4: Reloj analógico</h1>
<p>El reloj se actualiza automáticamente con la hora local de tu dispositivo.</p>
<div style="display:flex;justify-content:center;margin:24px 0">
<svg id="reloj" viewBox="0 0 240 240" style="width:min(100%,320px);filter:drop-shadow(0 8px 15px #0005)" aria-label="Reloj analógico">
<circle cx="120" cy="120" r="112" fill="#f5f2e9" stroke="#7c5cff" stroke-width="7"/>
<g id="marcas" fill="#20243b" font-size="15" font-weight="bold" text-anchor="middle"></g>
<line id="hora" x1="120" y1="120" x2="120" y2="70" stroke="#20243b" stroke-width="7" stroke-linecap="round"/>
<line id="minuto" x1="120" y1="120" x2="120" y2="48" stroke="#414b6b" stroke-width="5" stroke-linecap="round"/>
<line id="segundo" x1="120" y1="132" x2="120" y2="35" stroke="#e44d68" stroke-width="2" stroke-linecap="round"/>
<circle cx="120" cy="120" r="6" fill="#7c5cff"/>
</svg></div>
<div id="horaDigital" class="result" style="text-align:center;font-size:1.3rem"></div>
</main>
<script>

const marcas=document.getElementById('marcas');
for(let i=1;i<=12;i++){const a=i*Math.PI/6;const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',120+82*Math.sin(a));t.setAttribute('y',125-82*Math.cos(a));t.textContent=i;marcas.appendChild(t);}
function actualizar(){const d=new Date(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours()%12;document.getElementById('segundo').setAttribute('transform',`rotate(${s*6} 120 120)`);document.getElementById('minuto').setAttribute('transform',`rotate(${m*6+s*.1} 120 120)`);document.getElementById('hora').setAttribute('transform',`rotate(${h*30+m*.5} 120 120)`);document.getElementById('horaDigital').textContent=d.toLocaleTimeString('es-EC');}
actualizar();setInterval(actualizar,1000);

</script></body></html>
