<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 5: Validación de formulario</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#0b1020;color:#f4f6ff;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,100%);background:#151d33;border:1px solid #2b3657;border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 18px 55px #0005}
h1{margin-top:0;font-size:clamp(1.6rem,4vw,2.2rem)} p{color:#b8c2da;line-height:1.55}
button,input,select{font:inherit;border:0;border-radius:10px;padding:11px 14px;margin:5px 3px}
button{background:#7c5cff;color:white;cursor:pointer;font-weight:bold}button:hover{filter:brightness(1.12)} input,select{background:#0c1327;color:#fff;border:1px solid #354263;max-width:100%}
.back{display:inline-block;color:#a9ffe9;text-decoration:none;margin-bottom:20px} .muted{color:#aeb8d0} .result{margin-top:16px;color:#a9ffe9;font-weight:bold}

</style>
</head>
<body><main><a class="back" href="index.html">← Volver al menú principal</a><h1>Ejercicio 5: Validación de formulario</h1>
<p>Completa todos los campos. La información se valida en el navegador y no se envía a ningún servidor.</p>
<form id="formulario" novalidate>
<label for="nombre">Nombre completo</label><br><input id="nombre" autocomplete="name" placeholder="Tu nombre" style="width:100%" required><br>
<label for="correo">Correo electrónico</label><br><input id="correo" type="email" autocomplete="email" placeholder="nombre@ejemplo.com" style="width:100%" required><br>
<label for="clave">Contraseña (mínimo 6 caracteres)</label><br><input id="clave" type="password" autocomplete="new-password" placeholder="Contraseña" style="width:100%" required minlength="6"><br>
<button type="submit">Validar formulario</button><button type="reset" style="background:#34415f">Limpiar</button>
</form><div id="resultado" class="result" aria-live="polite"></div>
</main>
<script>

const form=document.getElementById('formulario');
form.addEventListener('submit',e=>{e.preventDefault();const nombre=document.getElementById('nombre').value.trim(),correo=document.getElementById('correo').value.trim(),clave=document.getElementById('clave').value;const r=document.getElementById('resultado');if(!nombre||!correo||!clave){r.textContent='Error: completa todos los campos.';return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)){r.textContent='Error: ingresa un correo electrónico válido.';return;}if(clave.length<6){r.textContent='Error: la contraseña debe tener al menos 6 caracteres.';return;}r.textContent='Formulario validado correctamente. ¡Gracias, '+nombre+'!';});
form.addEventListener('reset',()=>document.getElementById('resultado').textContent='');

</script></body></html>
